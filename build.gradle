plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.6' // pinned to migration-guide baseline
}

// Plugin version: bump here to release a new version.
// Keep in sync with any references in CHANGELOG / README until the 1.0.0 release.
version = '0.9.2'
group = 'io.nextflow'

dependencies {
    implementation 'com.quiltdata:quiltcore:0.1.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0'
    implementation 'commons-io:commons-io:2.19.0'
}

// QuiltSpecification reads the generated MANIFEST.MF from build/tmp/jar/ to
// initialise the plugin manager, so make sure the jar task runs first.
tasks.named('test') {
    dependsOn 'jar'
    useJUnitPlatform()
    // Required to run Nextflow / Groovy reflection-heavy tests on JDK 9+.
    jvmArgs([
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.nio.file.spi=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.fs=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.http=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.https=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.ftp=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.file=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    ])
}

nextflowPlugin {
    nextflowVersion = '24.10.0'
    provider = 'Quilt Data'
    className = 'nextflow.quilt.QuiltPlugin'
    extensionPoints = [
        'nextflow.quilt.QuiltObserverFactory',
        'nextflow.quilt.nio.QuiltPathFactory',
        'nextflow.quilt.nio.QuiltPathSerializer'
    ]
}
