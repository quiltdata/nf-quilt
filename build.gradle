plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.16'
    id 'jacoco'
}

// Plugin version: bump here to release a new version.
version = '1.1.1'
group = 'io.nextflow'

dependencies {
    implementation('com.quiltdata:quiltcore:0.1.7') {
        // quiltcore declares log4j 3.0.0-beta (pre-release, has unpatched CVEs)
        // but never calls it; it only serves as the SLF4J binding. Replaced
        // below with the patched log4j 2.x binding.
        exclude group: 'org.apache.logging.log4j'
    }
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.26.1'
    // Compile against the AWS SDK quiltcore already ships (same version), to
    // reference published S3 objects in a manifest. Not bundled separately.
    compileOnly 'software.amazon.awssdk:s3:2.29.40'
    testCompileOnly 'software.amazon.awssdk:s3:2.29.40'

    // Force patched versions of quiltcore's transitive deps (it pins
    // netty 4.2.0.RC1 and vert.x 5.0.0.CR3).
    implementation platform('com.fasterxml.jackson:jackson-bom:2.23.0')
    implementation platform('io.netty:netty-bom:4.2.21.Final')
    constraints {
        // Not vertx-stack-depchain: that BOM also manages slf4j/log4j versions.
        implementation 'io.vertx:vertx-core:5.2.3'
        implementation 'io.vertx:vertx-core-logging:5.2.3'
        implementation 'io.vertx:vertx-json-schema:5.2.3'
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'commons-io:commons-io:2.22.0'
}

// Lock the shipped (runtime) classpath in gradle.lockfile so vulnerability
// scanners (MegaLinter's grype/osv-scanner/trivy) see exactly what the plugin
// bundles. Compile-only deps (nextflow and its transitive deps) are provided by
// the user's Nextflow install, not shipped, so they aren't locked or scanned.
// After changing dependencies, run `make lock` (Renovate updates it automatically).
configurations.runtimeClasspath {
    resolutionStrategy.activateDependencyLocking()
}

// The io.nextflow.nextflow-plugin gradle plugin wires `test` to depend on
// `assemble` (which transitively runs `packagePlugin`). On Windows,
// `packagePlugin` fails with "character to be escaped is missing" because
// the upstream task uses `String.replaceAll(..., File.separator)` and `\`
// is an escape character in regex replacements
// (see https://github.com/nextflow-io/nextflow-plugin-gradle/issues/20).
// Until that upstream bug is fixed, we sever the test->assemble link so the
// test suite can run on Windows. `make assemble` / `make package` /
// `make release` still trigger packagePlugin on platforms where it works.
tasks.named('test') { task ->
    task.setDependsOn(task.getDependsOn().findAll { it != tasks.assemble && it != 'assemble' })
    task.dependsOn 'jar'
    useJUnitPlatform()
    // Tests otherwise run on the JDK 21 build toolchain, though the plugin
    // targets Java 17 and current Nextflow releases run on 17-26.
    if (project.hasProperty('testJavaVersion')) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(project.property('testJavaVersion'))
        }
    }
    // Required to run Nextflow / Groovy reflection-heavy tests on JDK 9+.
    jvmArgs([
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.nio.file.spi=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.fs=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.http=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.https=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.ftp=ALL-UNNAMED',
        '--add-opens=java.base/sun.net.www.protocol.file=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    ])
}

// JaCoCo line-coverage gate: 70% minimum, mirroring the pre-migration
// (single-subproject) build. Wired into `check` below.
jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.7
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

nextflowPlugin {
    nextflowVersion = '24.10.0'
    provider = 'Quilt Data, Inc.'
    className = 'nextflow.quilt.QuiltPlugin'
    extensionPoints = [
        'nextflow.quilt.QuiltObserverFactory',
        'nextflow.quilt.nio.QuiltPathFactory',
        'nextflow.quilt.nio.QuiltPathSerializer'
    ]
}
