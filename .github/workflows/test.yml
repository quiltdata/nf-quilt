name: Test

on:
  # Trigger at every push. Action will also be visible from Pull Requests to master
  push: # Comment this line to trigger action only on pull-requests (not recommended if you don't pay for GH Actions)
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  build:
    name: Test
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # Nextflow's minimum, the build JDK, the current LTS.
        java_version: [17, 21, 25]
    runs-on: ${{ matrix.os }}

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: arn:aws:iam::712023778557:role/github/GitHub-Testing-NF-Quilt
          aws-region: us-east-1

      - name: Setup Java ${{matrix.java_version}}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          # 21 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties).
          java-version: |
            21
            ${{matrix.java_version}}
          distribution: "temurin"
          architecture: x64
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Gradle Tests
        run: make test
        env:
          ORG_GRADLE_PROJECT_testJavaVersion: ${{matrix.java_version}}
          LOG4J_DEBUG: true

      - name: Archive production artifacts (Windows only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.os  == 'windows-latest' }}
        with:
          name: nf-quilt-test-reports-${{ matrix.os }}-${{ matrix.java_version }}
          path: |
            D:\a\nf-quilt\nf-quilt\build\reports\
          overwrite: true
      - name: Archive production artifacts (Linux and MacOS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.os != 'windows-latest' }}
        with:
          name: nf-quilt-test-reports-${{ matrix.os }}-${{ matrix.java_version }}
          path: |
            ${{ github.workspace }}/build/reports/
          overwrite: true
