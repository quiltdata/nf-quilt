name: Test

on:
  # Trigger at every push. Action will also be visible from Pull Requests to master
  push: # Comment this line to trigger action only on pull-requests (not recommended if you don't pay for GH Actions)
  pull_request:
    branches: [master]

permissions: read-all

jobs:
  build:
    name: Test
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        java_version: [17, 19, 21]
    runs-on: ${{ matrix.os }}

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::712023778557:role/github/GitHub-Testing-NF-Quilt
          aws-region: us-east-1

      - name: Setup Java ${{matrix.java_version}}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{matrix.java_version}}
          distribution: "temurin"
          architecture: x64
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Gradle Tests
        run: make test
        env:
          LOG4J_DEBUG: true

      - name: Archive production artifacts (Windows only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && matrix.os  == 'windows-latest' }}
        with:
          name: nf-quilt-test-reports-${{ matrix.os }}-${{ matrix.java_version }}
          path: |
            D:\a\nf-quilt\nf-quilt\build\reports\
          overwrite: true
      - name: Archive production artifacts (Linux and MacOS)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && matrix.os != 'windows-latest' }}
        with:
          name: nf-quilt-test-reports-${{ matrix.os }}-${{ matrix.java_version }}
          path: |
            ${{ github.workspace }}/build/reports/
          overwrite: true
